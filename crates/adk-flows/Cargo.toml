[package]
name = "adk-flows"
description = "LLM flow orchestration, ported from google/adk-python's flows/ module (Phase 4)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
adk-agents = { path = "../adk-agents" }
adk-events = { path = "../adk-events" }
adk-genai = { path = "../adk-genai" }
adk-models = { path = "../adk-models" }
adk-tools = { path = "../adk-tools" }
rusty_serde = { workspace = true }
rusty_err = { workspace = true }
rusty_tokio = { workspace = true }
regex = { workspace = true }
# `cache_performance_analyzer` (C0946) test double needs to name
# `SessionService::create_session`'s error type
# (`adk_errors::already_exists::AlreadyExistsError`) -- a new usage site
# of an already-vetted workspace dependency (adk-agents itself already
# depends on it), not a new sovereignty decision.
adk-errors = { path = "../adk-errors" }
