[package]
name = "adk-models"
description = "Model layer core, ported from google/adk-python's models/ module (Phase 3)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
adk-agents = { path = "../adk-agents" }
adk-genai = { path = "../adk-genai" }
adk-platform = { path = "../adk-platform" }
# C0125: progressive SSE streaming needs FeatureName::ProgressiveSseStreaming
# (adk-features, a zero-dependency leaf crate) and Event::new_id (adk-events)
# to synthesize function-call ids. Both were already transitive dependencies
# via adk-agents; adding them directly is a cycle-free Cargo.toml edit — see
# streaming_utils.rs's module doc for the full stale-blocker correction.
adk-features = { path = "../adk-features" }
adk-events = { path = "../adk-events" }
rusty_serde = { workspace = true }
rusty_err = { workspace = true }
rusty_tokio = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
tungstenite = { workspace = true }
sha2 = { workspace = true }
rusty_time = { workspace = true }
