[package]
name = "adk-agents"
description = "Agent core & context, ported from google/adk-python's agents/ module (Phase 2)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
adk-platform = { path = "../adk-platform" }
adk-errors = { path = "../adk-errors" }
adk-events = { path = "../adk-events" }
adk-genai = { path = "../adk-genai" }
# `app_configs` (C0283/C0284) needs `legacy_feature_decorator::warn_experimental`
# to wire the source's bare `@experimental` decorator (C0797, landed but
# unwired until now). Zero-dependency leaf crate; no cycle (adk-features
# depends on nothing).
adk-features = { path = "../adk-features" }
# `auth_tool` (C0504) needs `_stable_model_digest`'s SHA-256 hash of a
# canonicalized credential/scheme fingerprint. `sha2` is already a
# workspace dependency (`adk-models::gemini_context_cache_manager`, same
# "internally-consistent hash, not byte-matched to Python" rationale) —
# a new usage site, not a new sovereignty decision.
sha2 = { workspace = true }
rusty_serde = { workspace = true }
rusty_tokio = { workspace = true }
rusty_err = { workspace = true }
# `InMemoryMemoryService`'s keyword-search tokenization
# (`in_memory_memory_service.rs`, C0249) needs Unicode-aware `\w+`
# matching, the same way `load_web_page.rs` already uses this crate in
# `adk-tools` -- a new usage site of an already-vetted workspace
# dependency, not a new sovereignty decision.
regex = { workspace = true }
# `OAuth2DiscoveryManager` (C0534/C0535) needs a plain HTTP GET against a
# `.well-known` endpoint. `reqwest` is already adopted at the workspace
# level (`gemini.rs`/`load_web_page.rs` — see the root `Cargo.toml`'s own
# note on why `reqwest::blocking` is the right fit rather than its async
# client) — a new usage site, not a new sovereignty decision.
reqwest = { workspace = true }
