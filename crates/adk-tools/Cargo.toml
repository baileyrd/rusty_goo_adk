[package]
name = "adk-tools"
description = "Tool/toolset infrastructure, ported from google/adk-python's tools/ module (Phase 8)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
adk-agents = { path = "../adk-agents" }
# `code_executor_context` (C0390) needs a runtime clock for
# `update_code_execution_result`'s timestamp -- an already-vetted
# workspace dependency (every crate below this one in the graph already
# depends on it), just a new direct usage site.
adk-platform = { path = "../adk-platform" }
adk-events = { path = "../adk-events" }
adk-examples = { path = "../adk-examples" }
adk-genai = { path = "../adk-genai" }
adk-models = { path = "../adk-models" }
adk-runners = { path = "../adk-runners" }
rusty_serde = { workspace = true }
rusty_err = { workspace = true }
rusty_tokio = { workspace = true }
# `load_web_page` (C0427) needs a real HTTP client for the same reason
# `gemini.rs` already adopted `reqwest` (Phase 3) -- no new sovereignty
# decision here, just a new usage site of an already-vetted workspace
# dependency. `url` is added explicitly (not just used transitively
# through `reqwest::Url`) because the SSRF-hardening logic needs
# `url::Host`'s already-parsed Domain/Ipv4/Ipv6 variant, not just the
# opaque `Url` type -- and it's the exact crate `reqwest` itself
# re-exports `Url` from, so this isn't a new supply-chain surface.
reqwest = { workspace = true }
url = "2"
regex = { workspace = true }
# `skills_models` (C0393) needs `FeatureName::SnakeCaseSkillName`/
# `is_feature_enabled` to branch `Frontmatter::validate_name`'s pattern the
# same way the source does -- an already-existing internal workspace crate,
# same "new usage site of an already-vetted dependency" bar as this
# crate's other entries above, not a new sovereignty decision.
adk-features = { path = "../adk-features" }
# `Frontmatter::validate_name` (C0393) NFKC-normalizes `name` before
# validating it, matching the source's `unicodedata.normalize("NFKC", v)`.
# No workspace-internal equivalent exists. `unicode-normalization` is the
# standard `unicode-rs` crate for this (same GitHub org/maintainers as
# `unicode-general-category`, already adopted in `adk-eval` under this
# same "small, well-audited, near-zero-transitive-dependency" bar), with a
# single dependency of its own (`tinyvec`).
unicode-normalization = "0.1"
