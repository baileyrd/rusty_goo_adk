[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

# Sibling Rusty-Mill crates, pinned to a rev per the ecosystem's own
# convention (see rustils_async/rusty_time/rusty_err's own Cargo.tomls) —
# one source of truth, bumped deliberately rather than floating on a branch.
[workspace.dependencies]
rusty_serde = { git = "https://github.com/baileyrd/rusty_serde", rev = "ed0a0bd0029e3bfa96e62c6064f296233e07fc35", package = "rusty_serde" }
rusty_uuid = { git = "https://github.com/baileyrd/rusty_uuid", rev = "6bc9e04868fd3042d77d3bb757d40363654ebb45" }
rusty_time = { git = "https://github.com/baileyrd/rusty_time", rev = "21507244846586a37cb4bfb6700f746404efd3e8" }
rusty_err = { git = "https://github.com/baileyrd/rusty_err", rev = "992ede743fe16cefef789a85dad55891065d523a" }
# Async runtime, adopted in Phase 2 (agents/live_request_queue.py's
# asyncio.Queue needs one). Chosen over rustils_async: rustils_async is
# a narrow OS-level async-I/O primitives layer (process/fs/net domains
# only, "process" the sole Active one) with no task-spawning or channel
# API; rusty_tokio is a general-purpose runtime (work-stealing scheduler,
# mpsc/oneshot/watch/broadcast channels, timers) matching what ADK's
# in-process task/queue orchestration actually needs.
rusty_tokio = { git = "https://github.com/baileyrd/rusty_tokio", rev = "6e6f18471749ee8327ce52e9d9b825e2e9e5e1a7" }
# `LLMRegistry` (Phase 3) genuinely needs regex matching (model-name
# patterns like `gemini-.*`), not string-prefix matching dressed up as one.
# No sibling `rusty_regex` exists in the platform directory (checked); the
# `regex` crate is the standard, extremely well-audited choice for this and
# isn't a sovereignty-sensitive surface the way an HTTP client or crypto
# lib would be, so it's adopted directly rather than hand-rolled.
regex = "1"
# Gemini native backend (Phase 3 batch 2) needs a real HTTP client to talk
# to the Gemini/Vertex AI REST API — this *is* the sovereignty-sensitive
# surface the `regex` comment above contrasts itself with, so it gets the
# same scrutiny as the `rusty_tokio` runtime decision. Checked every
# sibling Rusty-Mill repo under the platform directory
# (rusty_time/rusty_err/rustils_async/rusty_tokio/rusty_json/rusty_std/
# rusty_uuid/rusty_serde) for an HTTP/TLS candidate the manifest's own
# sibling-check methodology names (`rusty_http`/`rusty_request`,
# `rusty_tls`) — none exists. `reqwest` is adopted with the `rustls-tls`
# feature (not `native-tls`/openssl) so the dependency is pure-Rust TLS
# with no system OpenSSL requirement, matching the sandboxed/CI
# environment this workspace builds in. Only the REST/SSE transport is
# decided here; the Live API's WebSocket transport (C0131/C0135-C0139) is
# its own decision, deferred to the batch that implements `connect()`.
#
# Phase 3 batch 3 discovered a real incompatibility: reqwest's *async*
# client needs a genuine `tokio` reactor underneath (it calls straight
# into `tokio::net::TcpStream`/`tokio::runtime::Handle::current()`), and
# `rusty_tokio` (adopted in Phase 2) is a from-scratch, independent async
# runtime — its own epoll reactor, its own scheduler — not a wrapper
# around real tokio. The two can't share a reactor. `reqwest::blocking`
# is the fix, not a workaround: it spins up its own private, self-
# contained `tokio::runtime::Runtime` internally regardless of the
# caller's ambient executor, so calling it is safe from any context.
# `gemini.rs` runs it via `rusty_tokio::spawn_blocking` (a real blocking-
# thread-pool offload, not a same-thread blocking call) so a slow HTTP
# call doesn't stall a `rusty_tokio` async worker thread. The `blocking`
# feature is enabled for exactly this reason.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "blocking",
] }
# Gemini Live API (Phase 3 batch 5) needs a WebSocket client. Checked every
# sibling Rusty-Mill repo under the platform directory (same list as the
# `reqwest` decision above) for a WS candidate — none exists. `tungstenite`
# (not `tokio-tungstenite`) is adopted: it's the synchronous, runtime-
# agnostic core `tokio-tungstenite` itself wraps, so it has the same
# "doesn't need a real tokio reactor" property that made
# `reqwest::blocking` the right fit for the REST transport (see that
# adaptation note in `gemini.rs`) — `rusty_tokio::spawn_blocking` bridges
# it into async code the same way. `rustls-tls-webpki-roots` keeps TLS
# pure-Rust, matching the `reqwest` decision (no system OpenSSL).
tungstenite = { version = "0.30", default-features = false, features = [
    "handshake",
    "rustls-tls-webpki-roots",
] }
# `GeminiContextCacheManager` (Phase 3 batch 5, C0140-C0143) needs a stable
# content hash for its cache-validity fingerprint (`_generate_cache_fingerprint`
# in the source — SHA-256, truncated to 16 hex chars). Checked every sibling
# Rusty-Mill repo under the platform directory (same list as the `reqwest`/
# `tungstenite` decisions above) for a hashing/crypto candidate — none
# exists. `sha2` (RustCrypto) is adopted: pure Rust, no system OpenSSL, the
# same "well-audited standard crate for a non-sovereignty-sensitive surface"
# rationale as `regex`. The fingerprint only needs to be internally
# consistent (same request state hashes the same, different state hashes
# differently) — it's never compared against Python's own hash — so the
# exact byte-for-byte canonicalization doesn't need to match the source,
# only the property that identical logical content produces identical
# output.
sha2 = "0.10"
# The same cache manager needs to parse the Gemini API's RFC3339
# `expireTime` response field into a Unix timestamp (`CacheMetadata.expire_time`
# is a `f64` epoch, matching the source's `datetime.timestamp()`) — reused
# from `rusty_time` (already declared above) rather than adding a second
# date/time crate.
